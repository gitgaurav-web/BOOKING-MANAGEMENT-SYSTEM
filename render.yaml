services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (Node.js + Express + Prisma + Supabase PostgreSQL)
  # ----------------------------------------------------------------------------
  - type: web
    name: ssce-hall-booking-portal
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: UPLOADS_DIR
        value: ./uploads
      - key: ALLOW_PRODUCTION_SEED
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Sri Sairam Central Facilities <facilities@sairamce.edu.in>"
