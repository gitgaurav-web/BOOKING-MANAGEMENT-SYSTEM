services:
  # ----------------------------------------------------------------------------
  # Sri Sairam College of Engineering - Central Transport & Fleet Portal
  # ----------------------------------------------------------------------------
  - type: web
    name: sairam-transport-portal
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: UPLOADS_DIR
        value: ./uploads
      - key: CLIENT_URL
        sync: false
